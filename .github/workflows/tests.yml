name: Tests

on: [push, pull_request]

jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validation_metrics.py data/lafeo3_validation
      - run: python scripts/volume_statistics.py examples/synthetic_volume.csv --n-fu 24 --discard 2 --block-size 4
